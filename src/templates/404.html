{% extends "base.html" %}

{% block main %}
{{ m.band(t.notfound.title, t.notfound.lead, none, link) }}
<section class="light-zone section" aria-label="{{ t.notfound.aria }}">
  <div class="wrap">
    <div class="order-row">
      <a class="btn btn-maroon" href="{{ link('') }}">{{ t.notfound.home }}</a>

    </div>
  </div>
</section>
{% endblock %}
