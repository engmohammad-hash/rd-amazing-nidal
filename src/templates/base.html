<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{ title }}</title>
<meta name="description" content="{{ description }}">
<link rel="canonical" href="{{ b.base_url }}{{ path }}">
<meta name="theme-color" content="#14000B">
<meta property="og:type" content="website">
<meta property="og:locale" content="ar_SA">
<meta property="og:site_name" content="{{ b.name }}">
<meta property="og:title" content="{{ title }}">
<meta property="og:description" content="{{ description }}">
<meta property="og:url" content="{{ b.base_url }}{{ path }}">
<meta property="og:image" content="{{ b.base_url }}{{ og_image }}">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="{{ root }}assets/img/logo-color.png">
<link rel="apple-touch-icon" href="{{ root }}assets/img/logo-color.png">
<link rel="preload" as="font" type="font/woff2" crossorigin href="{{ root }}assets/fonts/aref-ruqaa-700-arabic.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="{{ root }}assets/fonts/ibm-plex-sans-arabic-400-arabic.woff2">
<link rel="preload" as="font" type="font/woff2" crossorigin href="{{ root }}assets/fonts/ibm-plex-sans-arabic-500-arabic.woff2">
<link rel="stylesheet" href="{{ root }}assets/css/site.css?v={{ version }}">
{% for f in preload %}<link rel="preload" as="fetch" crossorigin href="{{ root }}{{ f.href }}" media="{{ f.media }}" fetchpriority="high">
{% endfor %}<script type="application/ld+json">{{ jsonld | safe }}</script>
</head>
<body data-root="{{ root }}">
<a class="skip" href="#main">تخطَّ إلى المحتوى</a>
{% include "partials/header.html" %}
<main id="main">
{% block main %}{% endblock %}
</main>
{% include "partials/footer.html" %}
<a class="wa-float" href="{{ wa('مرحباً، أود الاستفسار عن خدماتكم.') }}" target="_blank" rel="noopener" aria-label="تواصل عبر واتساب">{% include "partials/wa-icon.svg" %}</a>
<script src="{{ root }}assets/js/site.js?v={{ version }}" defer></script>
</body>
</html>
